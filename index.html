<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/style.css" rel="stylesheet">
</head>
<body class="bg-zinc-800 p-6"> 
  <h1 class="text-4xl font-bold mb-10 text-white text-center">
    Discover the <span class="text-yellow-200">weather</span> in every city you go
  </h1>

  <div>
    <div class="flex items-center justify-center">
      <form class="flex items-center w-full border border-yellow-200 rounded-full p-1 max-w-md bg-transparent shadow-yellow-100" id="searchForm">
        
        <input 
          type="text" 
          class="flex-1 bg-transparent px-4 py-2 text-gray-700 placeholder-gray-400 focus:outline-none" 
          placeholder="Enter your city..." 
          id="searchInput" 
        />
        
        <button 
          type="submit" 
          class="bg-yellow-300 hover:bg-yellow-400 text-gray-800 font-medium px-6 py-2 rounded-full transition-colors" 
          id="searchButton"
        >
          Search
        </button>

      </form>
    </div>
 
    <div id="weather-info" class="mt-6" hidden>
      <p id="temperature"></p>
      <p id="wind-speed"></p>
      <p id="humidity"></p>
      <p id="cloud-cover"></p>
    </div>
  </div>

  <section id="week-days" class="text-white">
    <div>
      <div>
        <p>Mon</p>
        <div></div>
        <p>Data</p>
      </div>

      <div>
        <p>Tue</p>
        <div></div>
        <p>Data</p>
      </div>

      <div>
        <p>Wed</p>
        <div></div>
        <p>Data</p>
      </div>

      <div>
        <p>Thu</p>
        <div></div>
        <p>Data</p>
      </div>

      <div>
        Fri
        <div></div>
        <p>Data</p>
      </div>

      <div>
        <p>Sat</p>
        <div></div>
        <p>Data</p>
      </div>

      <div>
        <p>Sun</p>
        <div></div>
        <p>Data</p>
      </div>

    </div>
  </section>
</body>
</html>
