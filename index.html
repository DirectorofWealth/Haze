<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/style.css" rel="stylesheet">
</head>
<body class="bg-zinc-800 p-6"> 

  <div id="title-display">
    <h1 class="text-4xl font-bold mb-10 text-white text-center">
      Discover the <span class="text-yellow-200">weather</span> in every city you go
    </h1>
    <!-- <h2 id="city-name"></h2>
    <p id="country-name"></p> -->
  </div>

  <div>
    <div class="flex items-center justify-center">
      <form class="flex items-center w-full border border-yellow-200 rounded-full p-1 max-w-md bg-transparent shadow-yellow-100" id="searchForm">
        
        <input 
          type="text" 
          class="flex-1 bg-transparent px-4 py-2 text-gray-700 placeholder-gray-400 focus:outline-none rounded-3xl" 
          placeholder="Enter your city..." 
          id="searchInput" 
        />
        
        <button 
          type="submit" 
          class="bg-yellow-300 hover:bg-yellow-400 text-gray-800 font-medium px-6 py-2 rounded-full transition-colors cursor-pointer" 
          id="searchButton"
        >
          Search
        </button>

      </form>
    </div>
 
    <div id="weather-info" class="mt-6 text-yellow-300" hidden>

      <p id="condition"></p>
  
      <p id="temperature"></p>
  
      <p id="wind-speed"></p>
  
      <p id="humidity"></p>
  
      <p id="cloud-cover"></p>
  
  </div>
  </div>

  <section id="week-days" class="text-white mt-10">

    <div
        id="forecast-container"
        class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4"
    >
    </div>

</section>
  

  <script src="/src/main.js"></script>
</body>
</html>
